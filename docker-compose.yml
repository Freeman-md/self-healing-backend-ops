services:
  postgres:
    image: postgres:16-alpine
    container_name: managed-system-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: managed_system
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - managed_system_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d managed_system"]
      interval: 5s
      timeout: 5s
      retries: 10

  managed-system:
    build:
      context: ./managed-system
      dockerfile: ../Dockerfile.managed-system
    container_name: managed-system-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      LOG_LEVEL: info
      METRICS_ENABLED: "true"
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/managed_system
    ports:
      - "3004:3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 10

  managing-system:
    build:
      context: ./managing-system
      dockerfile: ../Dockerfile.managing-system
    container_name: managing-system-app
    depends_on:
      managing-system-postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      MANAGED_SYSTEM_BASE_URL: http://managed-system:3000
      DATABASE_URL: postgresql://${MANAGING_SYSTEM_POSTGRES_USER:?Set MANAGING_SYSTEM_POSTGRES_USER}:${MANAGING_SYSTEM_POSTGRES_PASSWORD:?Set MANAGING_SYSTEM_POSTGRES_PASSWORD}@managing-system-postgres:5432/${MANAGING_SYSTEM_POSTGRES_DB:?Set MANAGING_SYSTEM_POSTGRES_DB}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      DOCKER_ACTIONS_ENABLED: "true"
      DOCKER_ACTION_TIMEOUT_MS: "10000"
      POST_ACTION_HEALTH_TIMEOUT_MS: "30000"
      POST_ACTION_HEALTH_POLL_INTERVAL_MS: "1000"
      MANAGING_SYSTEM_RUN_MODE: monitor
      RECOVERY_MODE: ${RECOVERY_MODE:?Set RECOVERY_MODE to baseline or agent}
      MONITOR_INTERVAL_MS: ${MONITOR_INTERVAL_MS:-30000}
      MONITOR_CONSECUTIVE_UNHEALTHY_THRESHOLD: ${MONITOR_CONSECUTIVE_UNHEALTHY_THRESHOLD:-2}
      MONITOR_RECOVERY_COOLDOWN_MS: ${MONITOR_RECOVERY_COOLDOWN_MS:-60000}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - managing_system_experiment_data:/managing-system/experiment-output

  managing-system-postgres:
    image: postgres:16-alpine
    container_name: managing-system-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${MANAGING_SYSTEM_POSTGRES_DB:?Set MANAGING_SYSTEM_POSTGRES_DB}
      POSTGRES_USER: ${MANAGING_SYSTEM_POSTGRES_USER:?Set MANAGING_SYSTEM_POSTGRES_USER}
      POSTGRES_PASSWORD: ${MANAGING_SYSTEM_POSTGRES_PASSWORD:?Set MANAGING_SYSTEM_POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - managing_system_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MANAGING_SYSTEM_POSTGRES_USER:?Set MANAGING_SYSTEM_POSTGRES_USER} -d ${MANAGING_SYSTEM_POSTGRES_DB:?Set MANAGING_SYSTEM_POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  managed_system_postgres_data:
  managing_system_postgres_data:
  managing_system_experiment_data:
